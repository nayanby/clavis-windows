<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' blob:; img-src 'self' data: blob: clavis-media: https:; media-src 'self' blob: clavis-media: https:; connect-src 'self' blob: data: clavis-media: https:; font-src 'self' data: blob:; frame-src blob: 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'">
<title>Clavis</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="sidebar.css"><link rel="stylesheet" href="pastel.css"></head>
<body><aside id="sidebar"><div class="brand"><img src="../assets/icon.png" alt=""><span>Clavis<small>READ · LISTEN · DISCOVER</small></span></div><div class="sidebar-scroll" tabindex="0" aria-label="Sidebar navigation"><nav id="navigation"></nav><div class="sidebar-bottom"><button data-route="Downloads"><span class="nav-icon" data-icon="Downloads"></span><span>Downloads</span></button><button data-route="Settings"><span class="nav-icon" data-icon="Settings"></span><span>Settings</span></button><button id="files"><span class="nav-icon" data-icon="Files"></span><span>Open books folder</span></button><p>Your library. Your pace.</p></div></div></aside>
<div id="workspace"><header><div><p id="eyebrow">YOUR PERSONAL LIBRARY</p><h1 id="heading">Clavis</h1></div><div class="header-actions"><label class="search">⌕ <input id="search" type="search" placeholder="Search your library" aria-label="Search"></label><button class="primary" id="import">＋ Import</button></div></header><main id="main" tabindex="-1"><p>Opening your library…</p></main><footer id="mini" hidden></footer></div>
<section id="listen-panel" class="listen-panel" aria-label="Listen to this reading" hidden><div class="listen-head"><button id="listen-back">Stop listening</button><div class="row"><span id="listen-chapter-label" class="pill">CHAPTER</span><button id="listen-page-prev" aria-label="Previous reading page">‹ Page</button><span id="listen-page-label" class="muted"></span><button id="listen-page-next" aria-label="Next reading page">Page ›</button><button id="listen-settings">Listen settings</button></div></div><div id="listen-stage" class="listen-stage"><article id="listen-text" class="listen-text"></article></div><div class="listen-dock"><div class="row spread"><span id="listen-location" class="muted"></span><span id="listen-percent" class="muted"></span></div><div class="listen-volume-row"><label for="listen-volume">Volume</label><input id="listen-volume" type="range" min="0" max="100" value="80" aria-label="Narration volume"><progress id="listen-progress" max="1000" value="0" aria-label="Narration progress"></progress></div><div class="listen-transport"><button id="listen-back30" aria-label="Back 30 words">−30</button><button id="listen-play" class="listen-play" aria-label="Play narration">▶</button><button id="listen-forward30" aria-label="Forward 30 words">+30</button></div><div class="listen-status-row"><p id="listen-status" class="listen-status"></p><button id="listen-download" hidden>Download offline voice · 44 MB</button></div></div></section><dialog id="dialog"><div class="dialog-top"><h2 id="dialog-title"></h2><div id="dialog-art" aria-hidden="true"></div><button id="dialog-close" aria-label="Close dialog">✕</button></div><div id="dialog-content"></div></dialog><div id="toast" role="status"></div><audio id="audio" preload="metadata"></audio><audio id="listen-audio" preload="auto"></audio><script type="module" src="bundle.js"></script></body></html>
